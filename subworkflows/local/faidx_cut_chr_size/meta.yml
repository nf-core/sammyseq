# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: faidx_cut_chr_size
description: Uncompress and prepare reference genome files
keywords:
  - index
  - fasta
  - faidx
  - chromosome
components:
  - samtools/faidx
input:
  - fasta_file:
    type: path
    description: |
      Input FASTA file
      Expected as path to a FASTA file
output:
  - sizes_genome:
      type: path
      description: |
        File containing chromosome lengths
        Generated from the FASTA file
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@lucidif"
  - "@nadiaxaidan"
maintainers:
  - "@daisymut"
