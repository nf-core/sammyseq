# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: cat_fractions
description:
keywords:
  - cat
  - fastq
  - concatenate
components:
  - cat/fastq
input:
  starting_files:
      type: file
      description: |
        List of input FastQ files to be concatenated.
output:
  - merged_reads:
      type: file
      description: |
        Merged fastq file
        Structure: [ val(meta), path(merged_reads) ]
      pattern: "*.{merged.fastq.gz}"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@nadiaxaidan"
maintainers:
  - "@daisymut"
